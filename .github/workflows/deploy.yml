name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore prepared font cache
        uses: actions/cache@v4
        with:
          path: .cache/fonts
          key: fonts-${{ runner.os }}-${{ hashFiles('fonts.lock.json', 'fonts.catalog.json') }}
      - name: Prepare verified font packages
        run: npm run fonts:prepare
      - name: Run tests
        run: npm test
      - name: Build
        # fork 后零配置：SITE_URL / BASE_PATH 从仓库上下文自动推导（SPEC §10.2）。
        # 若使用自定义域名：把 BASE_PATH 改为 '/'，并在 public/ 放置 CNAME 文件。
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
